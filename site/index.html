<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>dots — cross-platform dotfiles manager</title>
  <meta name="description" content="A fast, cross-platform dotfiles manager with an interactive TUI, written in Rust. Manage symlinks, install tools, and keep everything healthy on macOS and Linux.">
  <meta name="author" content="CtrlUserKnown">

  <link rel="icon" href="img/svg/dots_icon_color.svg" type="image/svg+xml">
  <link rel="alternate icon" href="img/svg/dots_favicons_color.svg">
  <link rel="apple-touch-icon" href="img/svg/dots_favicons_color.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="color-scheme" content="dark">

  <meta property="og:title" content="dots">
  <meta property="og:description" content="A fast, cross-platform dotfiles manager with an interactive TUI.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ctrluserknown.github.io/dots/">
  <meta property="og:image" content="https://ctrluserknown.github.io/dots/img/svg/dots_logo_color.svg">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="dots">
  <meta name="twitter:description" content="A fast, cross-platform dotfiles manager with an interactive TUI.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <span class="mark">✻</span>
  <span class="path">dots</span>
  <span class="dim hide-sm">— ~/.dots</span>
  <span class="spacer"></span>
  <a href="https://github.com/CtrlUserKnown/dots" target="_blank" rel="noopener noreferrer">github ↗</a>
</header>

<main class="stream" id="stream">
  <noscript>
    <h1>dots</h1>
    <p><strong>dots</strong> is a fast, cross-platform dotfiles manager with an interactive TUI,
    written in Rust. It installs your tools, wires up symlinks GNU Stow–style, applies premade app
    configs, and keeps everything healthy — on macOS (Homebrew) and Linux (apt/dnf) alike.</p>
    <p>Install:</p>
    <pre>curl -fsSL https://ctrluserknown.github.io/dots/install.sh | sh</pre>
    <p>This page is an interactive terminal and needs JavaScript. Everything it shows also lives in
    the <a href="https://github.com/CtrlUserKnown/dots#readme">README</a> and the
    <a href="https://github.com/CtrlUserKnown/dots/blob/main/CHANGELOG.md">changelog</a>.</p>
  </noscript>
</main>

<footer class="composer">
  <div class="popup" id="popup" hidden></div>
  <div class="chips" id="chips"></div>

  <div class="inputbox">
    <span class="caret">&gt;</span>
    <input id="input" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" enterkeyhint="go"
           placeholder="Ask about dots, or type / for commands" aria-label="terminal input">
  </div>

  <div class="hints">
    <span id="mode"></span>
    <span class="hide-sm">? for shortcuts</span>
    <span class="spacer"></span>
    <span id="ctx"></span>
  </div>
</footer>

<script src="js/content.js"></script>
<script src="js/term.js"></script>

</body>
</html>
