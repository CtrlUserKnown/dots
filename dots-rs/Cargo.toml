[workspace]
resolver = "2"
members = ["crates/tui-core", "crates/dots"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
ratatui    = "0.29"
crossterm  = "0.28"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
dirs       = "5"

# dev
tempfile   = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"    # minimize binary size
lto       = true
strip     = true
