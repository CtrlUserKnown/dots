[workspace]
resolver = "2"
members = ["crates/tui-core", "crates/dots"]

[workspace.package]
# The version under development — the release workflow refuses to build a tag
# that disagrees with this, so the fallback baked into a no-git tarball build
# can never drift behind the real releases again.
version = "2.3.1"
edition = "2021"

[workspace.dependencies]
ratatui    = "0.29"
crossterm  = "0.28"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
toml_edit  = "0.22"
anyhow     = "1"
dirs       = "5"

# Self-update: tarball extract + checksum verification (HTTP via ureq, already a dep).
flate2     = "1"
tar        = "0.4"
sha2       = "0.10"

# Lua plugin system: embedded Lua 5.4, statically vendored (needs a C compiler).
mlua       = { version = "0.10", features = ["lua54", "vendored"] }

# dev
tempfile   = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"    # minimize binary size
lto       = true
strip     = true
