name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dots-rs

      - name: Unit + integration tests
        run: cargo test --manifest-path dots-rs/Cargo.toml --all

      - name: Clippy
        run: cargo clippy --manifest-path dots-rs/Cargo.toml -- -D warnings

      - name: Format check
        run: cargo fmt --manifest-path dots-rs/Cargo.toml -- --check

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bash integration test
        run: bash dots-rs/tests/integration/test_setup.sh
