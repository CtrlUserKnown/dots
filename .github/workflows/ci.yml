name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Unit + integration tests
        run: cargo test --manifest-path Cargo.toml --all

      - name: Clippy
        run: cargo clippy --manifest-path Cargo.toml -- -D warnings

  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bash integration test
        run: bash tests/integration/test_setup.sh
