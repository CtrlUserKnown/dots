name: Release

# Publishes prebuilt `dots` binaries whenever a version tag is pushed.
# Asset names match what install.sh / setup.sh download:
#   dots-<tag>-<os>-<arch>.tar.gz   (e.g. dots-v1.6.0-linux-x86_64.tar.gz)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.6.0)'
        required: true

permissions:
  contents: write

jobs:
  # Fail before any of the four builds start if the tag and the workspace
  # manifest disagree. A mismatch is silent otherwise: the prebuilt binaries
  # take their version from DOTS_VERSION, so only builds that fall back to the
  # manifest (a source tarball with no git) would report the stale number.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match Cargo.toml
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          manifest=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "::error::tag $tag disagrees with Cargo.toml version $manifest"
            echo "Bump [workspace.package] version in Cargo.toml (and Cargo.lock) to ${tag#v}, or retag."
            exit 1
          fi
          echo "tag $tag matches Cargo.toml $manifest"

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu,  os: linux,  arch: x86_64,  cross: false }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, os: linux,  arch: aarch64, cross: true  }
          - { runner: macos-latest,  target: x86_64-apple-darwin,       os: darwin, arch: x86_64,  cross: false }
          - { runner: macos-latest,  target: aarch64-apple-darwin,      os: darwin, arch: aarch64, cross: false }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.target }}

      # aarch64 Linux needs a cross-linker; rustls (ring) is pure Rust so no OpenSSL.
      - name: Install cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Inject the exact tag so the binary self-reports it (build.rs bakes
          # this in), independent of whether the checkout fetched git tags.
          DOTS_VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path Cargo.toml

      - name: Package
        id: pkg
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          asset="dots-${tag}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" dots
          sha256sum "$asset" > "$asset.sha256" 2>/dev/null || shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
