name: Deploy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - install.sh
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Mirror the canonical root files into the published site: the installer
      # (so both raw.githubusercontent.com and <pages>/install.sh work) and the
      # changelog (fetched at runtime by js/changelog.js).
      - name: Stage root files
        run: cp install.sh CHANGELOG.md site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
